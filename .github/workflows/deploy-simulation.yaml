name: Deploy WarpX Simulation

on:
  workflow_dispatch:
    inputs:
      simulation_type:
        description: "Simulation Type"
        required: true
        default: "2d"
        type: choice
        options:
          - "2d"
          - "3d"
      job_name:
        description: "Unique Job Name (e.g., run-001)"
        required: true
        default: "warpx-run-1"
      timeout:
        description: "Timeout in seconds (Default: 3600)"
        required: false
        default: "3600"

permissions:
  id-token: write # Required for OIDC
  contents: read # Required to checkout code

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER_NAME: duploinfra-dev
  IAM_ROLE_ARN: arn:aws:iam::359835242613:role/GitHubAction-EKS-Deployer
  TARGET_NODE_LABEL: "node.kubernetes.io/instance-type=g5.12xlarge"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # STEP 1: Node Availability Check
      # ---------------------------------------------------------
      - name: Check Node Availability
        run: |
          echo "Checking for READY nodes with label: ${{ env.TARGET_NODE_LABEL }}..."

          # Simple text count, safe from errors
          NODE_COUNT=$(kubectl get nodes -l ${{ env.TARGET_NODE_LABEL }} --no-headers 2>/dev/null | grep -w "Ready" | wc -l)

          echo "Found $NODE_COUNT ready nodes."

          if [ "$NODE_COUNT" -eq "0" ]; then
            echo "::error::No READY nodes found with label ${{ env.TARGET_NODE_LABEL }}. Cannot schedule simulation."
            exit 1
          fi
          echo "Node check passed. Proceeding."

      # ---------------------------------------------------------
      # STEP 2: Prepare & Cleanup
      # ---------------------------------------------------------
      - name: Prepare Manifest
        run: |
          echo "Preparing ${{ inputs.simulation_type }} simulation..."

          TEMPLATE_FILE="k8s-manifests/warpx-${{ inputs.simulation_type }}.yaml"
          FINAL_MANIFEST="final-deployment.yaml"
          OUTPUT_DIR="output_${{ inputs.simulation_type }}_${{ inputs.job_name }}"

          echo "Job Name: ${{ inputs.job_name }}"
          echo "Output Dir: $OUTPUT_DIR"

          # Cleanup existing job
          if kubectl get mpijob ${{ inputs.job_name }} -n duploservices-dev > /dev/null 2>&1; then
            echo "⚠️  Found existing job. Deleting..."
            kubectl delete mpijob ${{ inputs.job_name }} -n duploservices-dev --timeout=30s
            echo "✅ Old job deleted."
          fi

          cp $TEMPLATE_FILE $FINAL_MANIFEST

          # --- Replace Placeholders (Using {{ }} as requested) ---
          sed -i "s/{{JOB_NAME}}/${{ inputs.job_name }}/g" $FINAL_MANIFEST
          sed -i "s|{{OUTPUT_DIR}}|$OUTPUT_DIR|g" $FINAL_MANIFEST

          echo "Manifest prepared."

      - name: Deploy to EKS
        run: |
          kubectl apply -f final-deployment.yaml --validate=false
          echo "Deployment submitted!"

      # ---------------------------------------------------------
      # STEP 3: Wait for Completion (Fixed Logic)
      # ---------------------------------------------------------
      - name: Wait for Simulation Completion
        run: |
          JOB_NAME="${{ inputs.job_name }}"
          NAMESPACE="duploservices-dev"
          TIMEOUT="${{ inputs.timeout }}"

          echo "Waiting for Launcher pod to initiate..."

          MAX_RETRIES=30
          COUNTER=0
          LAUNCHER_POD=""

          # 1. Find the Pod (Using awk to avoid quote issues)
          until [ ! -z "$LAUNCHER_POD" ] || [ $COUNTER -eq $MAX_RETRIES ]; do
             # List pods for job, grep for 'launcher', pick first column name
             LAUNCHER_POD=$(kubectl get pods -n $NAMESPACE -l training.kubeflow.org/job-name=$JOB_NAME --no-headers 2>/dev/null | grep launcher | awk '{print $1}' | head -n 1)

             if [ -z "$LAUNCHER_POD" ]; then
                sleep 2
                COUNTER=$((COUNTER+1))
             fi
          done

          if [ -z "$LAUNCHER_POD" ]; then
             echo "::error::Launcher pod was not created within 60 seconds."
             exit 1
          fi

          echo "Tracking Pod: $LAUNCHER_POD"
          START_TIME=$(date +%s)

          # 2. Monitor Status
          while true; do
            # Get Pod Phase (Running, Succeeded, Failed) using simple awk
            PHASE=$(kubectl get pod $LAUNCHER_POD -n $NAMESPACE --no-headers 2>/dev/null | awk '{print $3}')
            
            # Check if Job Succeeded (Backup check in case pod is gone)
            # We just check if the description contains "Succeeded=True"
            JOB_DESC=$(kubectl describe mpijob $JOB_NAME -n $NAMESPACE 2>/dev/null || echo "")
            
            if echo "$JOB_DESC" | grep -q "Succeeded.*True"; then
               JOB_SUCCEEDED="True"
            else
               JOB_SUCCEEDED="False"
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))
            
            echo "[$ELAPSED s] Pod: $PHASE | Job Success: $JOB_SUCCEEDED"

            if [ "$PHASE" == "Succeeded" ] || [ "$PHASE" == "Completed" ] || [ "$JOB_SUCCEEDED" == "True" ]; then
               echo "✅ Simulation Completed Successfully!"
               sleep 5
               break
            elif [ "$PHASE" == "Failed" ] || [ "$PHASE" == "Error" ]; then
               echo "::error::❌ Simulation Failed!"
               kubectl logs $LAUNCHER_POD -n $NAMESPACE --tail=50 || true
               exit 1
            elif [ $ELAPSED -gt $TIMEOUT ]; then
               echo "::error::⏰ Simulation Timed Out."
               exit 1
            fi
            
            sleep 10
          done
